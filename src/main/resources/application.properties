# ---------------------------------------------------------------------------
# Student Portal - application configuration
# ---------------------------------------------------------------------------

spring.application.name=StudentPortal
server.port=8080

# Embedded H2 database (in memory). Data is recreated on every start.
spring.datasource.url=jdbc:h2:mem:studentportal;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.jpa.defer-datasource-initialization=true

# H2 web console: http://localhost:8080/h2-console (JDBC URL as above, user sa, empty password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Templates are re-read from disk so HTML changes show up without a restart
spring.thymeleaf.cache=false

# Readable validation of the registration form
logging.level.org.springframework.web=INFO
